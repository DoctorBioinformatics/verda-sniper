name: snipe

# GitHub's cron is unreliable at high frequency - it deprioritises and silently
# skips scheduled runs under load. So this does NOT depend on cron firing
# punctually. Each run watches for ~5h50m (just under the 6h job limit), and the
# cron only needs to land occasionally to start the next long watch. A guard
# step exits immediately if another watch is already running, so the frequent
# cron attempts are cheap rather than duplicated.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what it would book, without booking"
        type: boolean
        default: false
      probe:
        description: "Fire the real booking POST once to prove it is accepted (books if stock exists)"
        type: boolean
        default: false
      check:
        description: "Only resolve image + SSH key and list what Verda allows; books nothing"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Skip if a watch is already running
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          others=$(gh run list --workflow=snipe.yml --status=in_progress \
                     --limit 20 --json databaseId --jq \
                     "[.[] | select(.databaseId != ${THIS_RUN})] | length")
          echo "other watches running: $others"
          if [ "${others:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Watch and book
        if: steps.guard.outputs.skip == 'false' || inputs.probe || inputs.check
        env:
          VERDA_CLIENT_ID: ${{ secrets.VERDA_CLIENT_ID }}
          VERDA_CLIENT_SECRET: ${{ secrets.VERDA_CLIENT_SECRET }}
          VERDA_POLL_SECONDS: "10"
          # ~5h50m, just under the 6h job limit. A dry run only needs to prove
          # auth and the image/key lookups, so keep that short.
          VERDA_RUN_SECONDS: ${{ inputs.dry_run && '30' || '21000' }}
          VERDA_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          VERDA_PROBE: ${{ inputs.probe && '1' || '0' }}
          VERDA_CHECK: ${{ inputs.check && '1' || '0' }}
        run: python3 verda_sniper.py

      # A watch lasts ~6h and then must be restarted. GitHub's cron cannot be
      # relied on to do that (it silently skips high-frequency schedules), so
      # each run starts its successor itself. GITHUB_TOKEN deliberately cannot
      # trigger new runs, hence a PAT. Without SNIPE_PAT this step no-ops and
      # you fall back to the unreliable cron.
      - name: Start the next watch
        # Only the run that actually watched may start a successor. Without the
        # guard check, a skipped run would dispatch another skipped run and
        # spin in a tight loop.
        if: always() && !inputs.probe && !inputs.check && steps.guard.outputs.skip == 'false' && hashFiles('BOOKED.json') == '' && hashFiles('INSTANCE_EXISTS') == ''
        env:
          GH_TOKEN: ${{ secrets.SNIPE_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No SNIPE_PAT secret - cannot self-restart; relying on cron."
            exit 0
          fi
          # If this watch died early (bad credentials, API outage) restarting at
          # once would hammer Actions. Floor the restart interval at a minute.
          elapsed=$(( $(date +%s) - START_EPOCH ))
          if [ "$elapsed" -lt 60 ]; then
            echo "watch only lasted ${elapsed}s - backing off before restart"
            sleep 60
          fi
          gh workflow run snipe.yml --repo "${{ github.repository }}"
          echo "next watch dispatched"

      - name: Tell me it went blind or could not book
        if: always() && (hashFiles('BOOK_FAILED.json') != '' || failure())
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The A6000 watcher needs attention."
            echo
            if [ -f BOOK_FAILED.json ]; then
              echo "It SAW an available A6000 and failed to book it:"
              echo '```json'
              cat BOOK_FAILED.json
              echo '```'
              echo "Read the detail above - it is Verda's own reason. Do not assume"
            echo "it is the balance; the first two misses were an image Verda does"
            echo "not allow on this GPU."
            else
              echo "The run failed. If the log says FEED DEAD, the availability"
              echo "query is broken and the watcher is blind - it will report"
              echo "'no stock' forever until that is fixed."
            fi
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > alert.md
          gh issue create --title "A6000 watcher needs attention" --body-file alert.md

      - name: Tell me it booked
        if: hashFiles('BOOKED.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The sniper booked an RTX A6000."
            echo
            echo '```json'
            cat BOOKED.json
            echo '```'
            echo
            echo "Next: rsync the code to /root/ac2 and run scripts/verda_bootstrap.sh."
            echo "Top up the balance - it is metered and a drained balance deletes the box."
          } > issue.md
          gh issue create --title "Verda A6000 BOOKED" --body-file issue.md
