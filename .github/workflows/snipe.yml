name: snipe

# GitHub's cron is unreliable at high frequency - it deprioritises and silently
# skips scheduled runs under load. So this does NOT depend on cron firing
# punctually. Each run watches for ~5h50m (just under the 6h job limit), and the
# cron only needs to land occasionally to start the next long watch. A guard
# step exits immediately if another watch is already running, so the frequent
# cron attempts are cheap rather than duplicated.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what it would book, without booking"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Skip if a watch is already running
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          others=$(gh run list --workflow=snipe.yml --status=in_progress \
                     --limit 20 --json databaseId --jq \
                     "[.[] | select(.databaseId != ${THIS_RUN})] | length")
          echo "other watches running: $others"
          if [ "${others:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Watch and book
        if: steps.guard.outputs.skip == 'false'
        env:
          VERDA_CLIENT_ID: ${{ secrets.VERDA_CLIENT_ID }}
          VERDA_CLIENT_SECRET: ${{ secrets.VERDA_CLIENT_SECRET }}
          VERDA_POLL_SECONDS: "10"
          # ~5h50m, just under the 6h job limit. A dry run only needs to prove
          # auth and the image/key lookups, so keep that short.
          VERDA_RUN_SECONDS: ${{ inputs.dry_run && '30' || '21000' }}
          VERDA_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 verda_sniper.py

      # A watch lasts ~6h and then must be restarted. GitHub's cron cannot be
      # relied on to do that (it silently skips high-frequency schedules), so
      # each run starts its successor itself. GITHUB_TOKEN deliberately cannot
      # trigger new runs, hence a PAT. Without SNIPE_PAT this step no-ops and
      # you fall back to the unreliable cron.
      - name: Start the next watch
        if: always() && hashFiles('BOOKED.json') == ''
        env:
          GH_TOKEN: ${{ secrets.SNIPE_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No SNIPE_PAT secret - cannot self-restart; relying on cron."
            exit 0
          fi
          gh workflow run snipe.yml --repo "${{ github.repository }}"
          echo "next watch dispatched"

      - name: Tell me it booked
        if: hashFiles('BOOKED.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The sniper booked an RTX A6000."
            echo
            echo '```json'
            cat BOOKED.json
            echo '```'
            echo
            echo "Next: rsync the code to /root/ac2 and run scripts/verda_bootstrap.sh."
            echo "Top up the balance - it is metered and a drained balance deletes the box."
          } > issue.md
          gh issue create --title "Verda A6000 BOOKED" --body-file issue.md
